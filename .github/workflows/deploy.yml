name: Build & Deploy (AWS Lightsail)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # allow manual trigger from GitHub UI

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  # ─────────────────────────────────────────────
  # Job 1 – Build & unit test
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # NuGet audit: fail on high (NU1903) or critical (NU1904) advisories, including
      # transitive packages, so vulnerable dependencies can't ship unnoticed (issue #102).
      - name: Restore dependencies (fail on high/critical advisories)
        run: dotnet restore -p:NuGetAuditMode=all -p:WarningsAsErrors="NU1903%3BNU1904"

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      - name: Run unit tests (exclude integration)
        continue-on-error: true
        run: dotnet test --no-build -c Release --filter "Category!=Integration"

  # ─────────────────────────────────────────────
  # Job 2 – Build the UI container image and push it to GHCR
  # (ghcr.io/<owner>/<repo>, tagged with the commit SHA and 'latest').
  # ─────────────────────────────────────────────
  publish-image:
    name: Publish Image
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR requires lowercase)
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ref=$name:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Job 3 – Deploy to the Lightsail instance over SSH
  #
  # Production uses the SQLite provider: migrations apply on app startup against
  # the database on the instance's Docker volume, so there is no CI migrate step.
  #
  # Requires (production environment):
  #   secrets.LIGHTSAIL_HOST         static IP or hostname of the instance
  #   secrets.LIGHTSAIL_SSH_KEY      private key from provision-lightsail.ps1
  #   secrets.LIGHTSAIL_KNOWN_HOSTS  "<host> <keytype> <key>" lines (pins host key; see guide, Step 3)
  #   vars.SITE_ADDRESS              e.g. "authorityrecords.dev, www.authorityrecords.dev"
  #   vars.ACME_EMAIL                Let's Encrypt account email
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: publish-image
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_DIR: /opt/authority-records
      SSH_TARGET: ubuntu@${{ secrets.LIGHTSAIL_HOST }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          for v in HOST SSH_KEY KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing LIGHTSAIL_${v} secret (see Documents/aws-deployment-guide.md)"; exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          # Pasting into the GitHub secret form can add CRLF line endings or stray
          # whitespace, either of which makes OpenSSH reject the key ("error in
          # libcrypto"). Normalize, then validate with a specific message.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            if grep -q '^ssh-' ~/.ssh/id_deploy; then
              echo "::error::LIGHTSAIL_SSH_KEY contains a PUBLIC key. Use the private key file (the one WITHOUT .pub)."
            elif ! grep -q -- '-----BEGIN .*PRIVATE KEY-----' ~/.ssh/id_deploy; then
              echo "::error::LIGHTSAIL_SSH_KEY is missing the '-----BEGIN ... PRIVATE KEY-----' line. Paste the entire private key file."
            elif ! grep -q -- '-----END .*PRIVATE KEY-----' ~/.ssh/id_deploy; then
              echo "::error::LIGHTSAIL_SSH_KEY is missing the '-----END ... PRIVATE KEY-----' line (truncated paste?). Paste the entire private key file."
            else
              echo "::error::LIGHTSAIL_SSH_KEY is not a valid unencrypted private key. Paste the entire private key file (see Documents/aws-deployment-guide.md, Step 3)."
            fi
            exit 1
          fi
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          # Fail early with a clear message if the pinned host key doesn't match the host.
          if ! ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::LIGHTSAIL_KNOWN_HOSTS has no entry for LIGHTSAIL_HOST. Each line must start with the same IP/hostname as LIGHTSAIL_HOST. See Documents/aws-deployment-guide.md, Step 3, to regenerate it."
            exit 1
          fi
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config

      - name: Upload compose stack
        env:
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          APP_IMAGE: ${{ needs.publish-image.outputs.image }}
        run: |
          if [ -z "$SITE_ADDRESS" ] || [ -z "$ACME_EMAIL" ]; then
            echo "::error::Set the SITE_ADDRESS and ACME_EMAIL variables on the production environment"; exit 1
          fi
          printf 'APP_IMAGE=%s\nSITE_ADDRESS=%s\nACME_EMAIL=%s\n' \
            "$APP_IMAGE" "$SITE_ADDRESS" "$ACME_EMAIL" > deploy/aws/.env
          scp deploy/aws/docker-compose.yml deploy/aws/Caddyfile deploy/aws/.env \
            "$SSH_TARGET:$DEPLOY_DIR/"

      - name: Pull & restart
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh "$SSH_TARGET" "GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' DEPLOY_DIR='$DEPLOY_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_DIR"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f

          # Smoke test from inside the compose network: wait for the app to answer.
          for i in $(seq 1 30); do
            if docker compose exec -T caddy wget -q -O /dev/null http://app:8080/account/login; then
              echo "App is responding."
              docker compose ps
              exit 0
            fi
            sleep 4
          done
          echo "App did not respond within 2 minutes. Recent logs:"
          docker compose logs --tail 100 app
          exit 1
          REMOTE
