name: Build, Migrate & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # allow manual trigger from GitHub UI

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  # ─────────────────────────────────────────────
  # Job 1 – Build & unit test
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      - name: Run unit tests (exclude integration)
        continue-on-error: true
        run: dotnet test --no-build -c Release --filter "Category!=Integration"

  # ─────────────────────────────────────────────
  # Job 2 – Apply EF Core database migrations
  # Runs after a successful build, before deploy.
  # Requires AZURE_SQL_CONNECTION_STRING secret.
  # ─────────────────────────────────────────────
  migrate:
    name: Apply DB Migrations
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Restore dependencies
        run: dotnet restore

      # Both factories read ConnectionStrings__DefaultConnection from env vars.
      - name: Migrate AppDbContext
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        run: |
          dotnet ef database update \
            --project Shared.Infrastructure/Shared.Infrastructure.csproj \
            --startup-project Shared.Infrastructure/Shared.Infrastructure.csproj \
            --context AppDbContext

      - name: Migrate AuthDbContext
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        run: |
          dotnet ef database update \
            --project Shared.Infrastructure/Shared.Infrastructure.csproj \
            --startup-project Shared.Infrastructure/Shared.Infrastructure.csproj \
            --context AuthDbContext

  # ─────────────────────────────────────────────
  # Job 3a – Publish & deploy the Blazor Server UI
  # ─────────────────────────────────────────────
  deploy-ui:
    name: Deploy UI
    runs-on: ubuntu-latest
    needs: migrate
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish UI
        run: |
          dotnet publish Modules.Records.UI/Modules.Records.UI.csproj \
            -c Release \
            -o publish/ui \
            --no-restore

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service (UI)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_UI_NAME }}
          package: publish/ui

  # ─────────────────────────────────────────────
  # Job 3b – Publish & deploy the background worker
  # (OutboxProcessor hosted service)
  # ─────────────────────────────────────────────
  deploy-worker:
    name: Deploy Worker
    if: ${{ vars.DEPLOY_WORKER_APP == 'true' }}
    runs-on: ubuntu-latest
    needs: migrate
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Worker
        run: |
          dotnet publish Api/Api.csproj \
            -c Release \
            -o publish/worker \
            --no-restore

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service (Worker)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_WORKER_NAME }}
          package: publish/worker
